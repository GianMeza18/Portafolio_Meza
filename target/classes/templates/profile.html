<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | e-Portafolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="site-nav is-scrolled"><div class="container nav-inner"><a class="brand" th:href="@{/#inicio}"><span class="brand-mark">GM</span><span>e-Portafolio</span></a><div class="hero-actions"><a class="button-secondary" th:href="@{/#evidencias}">Evidencias</a><a class="button-secondary" href="/logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a></div></div></nav>
<main class="profile-page">
    <div class="container profile-shell">
        <section class="profile-card">
            <div class="profile-header">
                <img th:src="${userProfile.photoUrl()} ?: '/img/mezafoto.jpeg'" alt="Foto de perfil" class="profile-avatar">
                <div>
                    <div class="section-label">Perfil de usuario</div>
                    <h1 th:text="${userProfile.name()}">Nombre</h1>
                    <p class="profile-email" th:text="${userProfile.email()}">correo@dominio.com</p>
                </div>
            </div>

            <form method="post" action="/perfil" class="auth-form profile-form">
                <label class="field">Nombre<input type="text" name="name" th:value="${userProfile.name()}" placeholder="Tu nombre"></label>
                <label class="field">Correo<input type="email" name="email" th:value="${userProfile.email()}" placeholder="correo@dominio.com"></label>
                <label class="field">Contraseña<input type="password" name="password" placeholder="Nueva contraseña"></label>
                <label class="field">URL de foto<input type="text" name="photoUrl" th:value="${userProfile.photoUrl()}" placeholder="https://... /img/... "></label>
                <button class="button-primary" type="submit">Guardar cambios</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
