spring.application.name=ProyectoAplicacionProfesional
server.port=${PORT:8080}

# MySQL / MariaDB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portafolio_meza?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Portfolio Configuration
portfolio.admin-email=admin@gianmeza.com
portfolio.admin-password=${PORTFOLIO_ADMIN_PASSWORD:gianmeza}
portfolio.storage-path=backed/evidencias
portfolio.users-path=backed/usuarios.txt

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Disable Thymeleaf
spring.thymeleaf.enabled=false
