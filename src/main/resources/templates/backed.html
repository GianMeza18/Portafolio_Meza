<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backed | e-Portafolio</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="site-nav is-scrolled"><div class="container nav-inner"><a class="brand" th:href="@{/#inicio}"><span class="brand-mark">GM</span><span>Backed privado</span></a><a class="button-secondary" href="/logout"><i class="bi bi-box-arrow-right"></i> Salir</a></div></nav><main class="backed-page"><div class="container"><div class="section-label">Panel del administrador</div><h1>Publicar evidencias.</h1><p class="backed-intro">Los archivos se guardan en <strong>backed/evidencias</strong> y aparecen inmediatamente en la página pública.</p><p class="form-success" th:if="${message}" th:text="${message}"></p><p class="form-error" th:if="${error}" th:text="${error}"></p><div class="upload-grid"><section class="upload-panel"><h2>Subir trabajo</h2><form method="post" action="/backed/subir" enctype="multipart/form-data" class="auth-form"><label class="field">Semana<select name="week" required><option th:each="week : ${weeks}" th:value="${week}" th:text="'Semana ' + ${#numbers.formatInteger(week, 2)}">Semana 01</option></select></label><label class="field">Archivo<input type="file" name="file" required></label><button class="button-primary" type="submit"><i class="bi bi-upload"></i> Publicar archivo</button></form></section><section class="upload-panel"><h2>Agregar enlace</h2><form method="post" action="/backed/enlace" class="auth-form"><label class="field">Semana<select name="week" required><option th:each="week : ${weeks}" th:value="${week}" th:text="'Semana ' + ${#numbers.formatInteger(week, 2)}">Semana 01</option></select></label><label class="field">Nombre<input type="text" name="name" placeholder="Repositorio o presentación" required></label><label class="field">Enlace<input type="url" name="url" placeholder="https://..." required></label><button class="button-primary" type="submit"><i class="bi bi-link-45deg"></i> Publicar enlace</button></form></section></div></div></main></body></html>
