<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso | e-Portafolio</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><main class="auth-page"><div class="auth-box"><a class="brand" th:href="@{/#inicio}"><span class="brand-mark">GM</span><span>e-Portafolio</span></a><div class="section-label">Acceso</div><h1>Iniciar sesión</h1><p class="auth-intro">Accede al portafolio o al panel privado según tu cuenta.</p><p class="form-error" th:if="${error}" th:text="${error}"></p><form method="post" action="/login" class="auth-form"><label class="field">Correo<input type="email" name="email" placeholder="correo@dominio.com" required></label><label class="field">Contraseña<input type="password" name="password" required></label><button class="button-primary" type="submit">Ingresar <i class="bi bi-arrow-right"></i></button></form><a class="button-secondary auth-back" th:href="@{/registro}">Registrarse</a><a class="button-secondary auth-back" th:href="@{/#inicio}">Volver al portafolio</a></div></main></body></html>
