services:
  - type: web
    name: portafolio-meza
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORTFOLIO_ADMIN_EMAIL
        sync: false
      - key: PORTFOLIO_ADMIN_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_SQL_INIT_MODE
        value: always
    disk:
      name: portafolio-data
      mountPath: /var/lib/portafolio
      sizeGB: 1