<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro | e-Portafolio</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><main class="auth-page"><div class="auth-box"><a class="brand" th:href="@{/#inicio}"><span class="brand-mark">GM</span><span>e-Portafolio</span></a><div class="section-label">Registro</div><h1>Crear cuenta</h1><p class="auth-intro">El portafolio es público para docentes y visitantes. El panel de publicación está reservado al administrador.</p><p class="form-success" th:if="${message}" th:text="${message}"></p><form method="post" action="/registro" class="auth-form"><label class="field">Correo<input type="email" name="email" required></label><label class="field">Contraseña<input type="password" name="password" minlength="6" required></label><button class="button-primary" type="submit">Registrarse <i class="bi bi-arrow-right"></i></button></form><a class="button-secondary auth-back" th:href="@{/login}">Ir al login</a></div></main></body></html>
