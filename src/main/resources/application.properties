spring.application.name=ProyectoAplicacionProfesional
server.port=${PORT:8080}

# MySQL / MariaDB
# Supports both: DB_URL + DB_USERNAME + DB_PASSWORD, and Render-style variables like HOST/PORT/USER/PASSWORD/DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:${MYSQL_HOST:${HOST:localhost}}}:${DB_PORT:${MYSQL_PORT:3306}}/${DB_NAME:${MYSQL_DATABASE:${DATABASE:portafolio_meza}}}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${USERNAME:${MYSQL_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${PASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=1
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Portfolio Configuration
portfolio.admin-email=${PORTFOLIO_ADMIN_EMAIL:admin@gianmeza.com}
portfolio.admin-password=${PORTFOLIO_ADMIN_PASSWORD:gianmeza}
portfolio.storage-path=${PORTFOLIO_STORAGE_PATH:backed/evidencias}
portfolio.users-path=${PORTFOLIO_USERS_PATH:backed/usuarios.txt}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Disable Thymeleaf
spring.thymeleaf.enabled=false
